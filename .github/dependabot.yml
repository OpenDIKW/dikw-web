version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint (every release through 8.70, incl. canary) peers
      # typescript <6.1.0; TS 7 breaks npm ci with ERESOLVE (see #178). Lift once
      # typescript-eslint supports it.
      - dependency-name: "typescript"
        versions: [">=7"]
      # mermaid 12 targets ES2024 / Safari 17.4+, but the reader still supports
      # Safari 16 (Vite's default build target); 12 would silently drop diagrams to
      # plain text there, and it re-lays out existing diagrams (see #185).
      - dependency-name: "mermaid"
        versions: [">=12"]
    groups:
      # MikroORM refuses to start unless every @mikro-orm/* package matches
      # @mikro-orm/core exactly, so core + sqlite always move in one PR.
      mikro-orm:
        patterns: ["@mikro-orm/*"]
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
