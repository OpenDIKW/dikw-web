name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel only redundant PR runs (cost saver during iteration). Never cancel a
  # main run: the `release` job tags from package.json.version, so a cancelled
  # main run would skip a version's tag when two version-bumping merges land close
  # together. Main runs instead queue and each runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    # NOTE: this exact job name is a *required status check* in branch protection.
    # Renaming it orphans the required check (GitHub matches by name) and BLOCKS
    # every merge until protection is updated — so keep it stable even though the
    # `verify` script now also runs lint + format:check.
    name: Verify (typecheck + coverage + build + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_WEB_TOOLS: ""
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium (+ system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run verify gate
        run: npm run verify

      - name: Bundle budget
        run: npm run check:bundle

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: Dependency audit (prod, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high --omit=dev

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks CLI
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repository history for secrets
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  trivy:
    name: Container scan (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRIVY_VERSION: "v0.70.0"
    steps:
      - uses: actions/checkout@v7

      - name: Build image for scanning
        run: docker build -t dikw-web:ci .

      - name: Scan image for OS/library CVEs (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dikw-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          version: ${{ env.TRIVY_VERSION }}

      - name: Scan Dockerfile and compose for misconfig (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          version: ${{ env.TRIVY_VERSION }}

  release:
    name: Release tag (dikw-web-v*)
    # Cuts a GitHub Release tagged dikw-web-v<package.json version> once the whole
    # CI is green on a push to main (i.e. a merged PR). Idempotent: it skips when
    # the tag already exists, so only an actual version bump produces a new tag —
    # which makes "every version update gets a tag" fall out for free. Notes come
    # from the matching CHANGELOG.md section. Job-scoped `contents: write` keeps the
    # workflow-level read-only default everywhere else.
    needs: [verify, audit, gitleaks, trivy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # This is the only job with `contents: write`; it authenticates `gh`
          # via GH_TOKEN and never uses the checkout's git credential, so drop the
          # persisted token (defense-in-depth for the write-scoped run).
          persist-credentials: false

      - name: Resolve version and check for existing tag
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="dikw-web-v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists — nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.meta.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env (not inline `${{ }}` in the script) to keep the version
          # out of the shell-command string — the standard guard against Actions
          # expression/script injection.
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          node scripts/changelog-notes.mjs "$VERSION" > release-notes.md
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "dikw-web v$VERSION" \
            --notes-file release-notes.md
