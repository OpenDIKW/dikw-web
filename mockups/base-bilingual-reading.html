<!doctype html>
<!--
  MOCKUP (alignment only) — #base bilingual parallel reading.
  Standalone, self-contained, no build / no backend / not wired into the app.
  Design tokens + reader styles are copied verbatim from src/styles.css so this
  previews how the feature would look inside the real dikw-web app.

  Aligned decisions (after user feedback rounds):
   - Entry FUSED with the Read tab (Variant C): "Read" label intact + a bonded 双语
     mode-toggle (aria-pressed) joined by a hairline seam. NOT in the reader header.
   - Language is unknown until fetch → detect AFTER render (CJK ratio). The 双语 toggle
     shows ONLY for English articles; Chinese pages show no toggle and no hint.
   - On-demand AI translation (loading + cached states). NO model name shown anywhere.
   - Special blocks (code/chart/table) render CENTERED as a single shared instance —
     not spanning both columns, not duplicated per column.
   - Wikilinks: both columns' links share one target; in bilingual mode a click opens an
     info card showing the target page's Chinese translation.
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mockup · #base 并行中文翻译</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ===== Tokens copied from src/styles.css:1–83 ===== */
      :root,
      html[data-theme="light"] {
        color-scheme: light;
        --font-ui:
          "Inter Tight", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans CN", "Noto Sans CJK SC",
          sans-serif;
        --font-mono:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", "Sarasa Mono SC",
          "Microsoft YaHei Mono", monospace;
        --bg: #f5f3ee;
        --surface: #ffffff;
        --surface-soft: #faf9f5;
        --surface-2: #f0eee8;
        --line: #e2dfd6;
        --line-strong: #cdc9bd;
        --hairline: #ebe8df;
        --text: #1a1d1c;
        --muted: #6c6f6a;
        --subtle: #95968f;
        --accent: #0d5e57;
        --accent-strong: #094540;
        --accent-soft: #e2eeec;
        --green: #2f7a4d;
        --amber: #8a5a14;
        --red: #a8362c;
        --blue: #2f6aa8;
        --reader-bg: #ffffff;
        --reader-text: #1f2624;
        --reader-muted: #6c6f6a;
        --reader-heading: #14181b;
        --reader-link: #094540;
        --reader-code-bg: #14181b;
        --reader-border: #e2dfd6;
        --reader-quote-bg: #eef5f3;
        --reader-table-bg: #f0eee8;
        --shadow: 0 1px 0 rgba(20, 29, 28, 0.04);
        --radius: 8px;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #14140f;
        --surface: #1b1b15;
        --surface-soft: #161611;
        --surface-2: #25241d;
        --line: #2f2d24;
        --line-strong: #4e4a3c;
        --hairline: #232017;
        --text: #f0eee7;
        --muted: #b0aca0;
        --subtle: #87826f;
        --accent: #4eb8a6;
        --accent-strong: #92e3d4;
        --accent-soft: #142a26;
        --green: #5ec78a;
        --amber: #e3ad4c;
        --red: #ef7f75;
        --blue: #75aee9;
        --reader-bg: #1b1b15;
        --reader-text: #e2dccc;
        --reader-muted: #ada89b;
        --reader-heading: #f4f1e7;
        --reader-link: #92e3d4;
        --reader-code-bg: #11110c;
        --reader-border: #2f2d24;
        --reader-quote-bg: #1f2a26;
        --reader-table-bg: #25241d;
        --shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-ui);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      /* ===== Mockup top bar (frames the demo, not part of the app) ===== */
      .mock-topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 22px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        backdrop-filter: saturate(1.1) blur(8px);
      }
      .mock-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        font-size: 15px;
      }
      .mock-brand .dot {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      }
      .mock-brand small {
        color: var(--subtle);
        font-weight: 500;
        font-size: 12px;
      }
      .mock-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12.5px;
      }
      .mock-controls label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
      }
      .mock-btn {
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
      }
      .mock-btn:hover {
        border-color: var(--line-strong);
      }
      .mock-tag {
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-strong);
        font-size: 11px;
        font-weight: 600;
      }

      /* ===== Layout — copied from .wiki-layout / .wiki-sidebar ===== */
      .mock-page {
        max-width: 1320px;
        margin: 0 auto;
        padding: 18px 22px 64px;
      }
      .wiki-layout {
        display: grid;
        grid-template-columns: minmax(280px, 320px) minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }
      .wiki-sidebar {
        position: sticky;
        top: 78px;
        display: grid;
        align-content: start;
        gap: 10px;
        padding: 14px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: linear-gradient(180deg, var(--surface) 0%, var(--surface-soft) 100%);
        box-shadow: var(--shadow);
      }
      .wiki-explorer__header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 10px;
        padding: 2px 2px 8px;
        border-bottom: 1px solid var(--line);
      }
      .wiki-explorer__header h2 {
        margin: 2px 0 0;
        color: var(--text);
        font-size: 15px;
        line-height: 1.25;
      }
      .wiki-explorer__header span {
        color: var(--subtle);
        font-size: 11px;
        font-family: var(--font-mono);
      }
      .wiki-list {
        display: grid;
        gap: 4px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .wiki-list__item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 8px 10px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .wiki-list__item:hover {
        background: var(--surface-2);
      }
      .wiki-list__item.is-active {
        border-color: var(--line);
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .wiki-list__item .wl-body {
        min-width: 0;
        flex: 1;
      }
      .wiki-list__item strong {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .wiki-list__item small {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
        font-family: var(--font-mono);
      }
      /* ===== Reader — copied from .panel + .wiki-reader + reader-header ===== */
      .panel {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
        padding: 16px;
      }
      .wiki-reader {
        min-height: calc(100vh - 132px);
        background: var(--reader-bg);
        color: var(--reader-text);
        padding: 22px 26px;
      }
      .reader-header--stacked {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--reader-border);
      }
      .reader-header__path {
        color: var(--reader-muted);
        font-size: 12px;
        font-weight: 500;
        font-family: var(--font-mono);
        overflow-wrap: anywhere;
      }
      .reader-header__meta--inline {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px;
      }
      .soft-label {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        padding: 3px 7px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      .lang-badge {
        border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
        color: var(--accent);
      }

      /* ===== Tab bar — copied .wiki-reader-tabs + the fused Read/双语 control (Variant C) ===== */
      .wiki-reader-tabs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin: 0 0 18px;
        padding: 4px;
        border: 1px solid var(--reader-border);
        border-radius: var(--radius);
        background: color-mix(in srgb, var(--reader-bg) 82%, var(--surface-2));
      }
      /* plain sibling tabs (Info / Outline / Source) — unchanged tab styling */
      .wrt-tab {
        padding: 7px 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--reader-muted);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .wrt-tab[aria-selected="true"] {
        background: var(--reader-bg);
        color: var(--reader-link);
        box-shadow: inset 0 0 0 1px var(--reader-border);
      }
      /* fused Read + 双语 slot = ONE pill, two bonded halves */
      .wrt-fused {
        display: inline-flex;
        align-items: stretch;
        border-radius: 6px;
        background: transparent;
      }
      .wrt-fused.is-active {
        background: var(--reader-bg);
        box-shadow: inset 0 0 0 1px var(--reader-border);
      }
      .wrt-read,
      .wrt-bi {
        border: 0;
        background: transparent;
        color: var(--reader-muted);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .wrt-read {
        padding: 7px 9px 7px 10px;
        border-radius: 6px 0 0 6px;
      }
      .wrt-read:only-child {
        padding: 7px 10px;
        border-radius: 6px;
      }
      .wrt-fused.is-active .wrt-read {
        color: var(--reader-link);
      }
      /* bonded 双语 half: hairline seam fuses it to Read */
      .wrt-bi {
        display: inline-flex;
        align-items: center;
        padding: 7px 11px;
        border-radius: 0 6px 6px 0;
        border-left: 1px solid var(--reader-border);
      }
      .wrt-read:hover,
      .wrt-bi:hover:not([aria-pressed="true"]) {
        color: var(--reader-text);
      }
      /* ON state: ride the existing inset-ring active treatment + a restrained accent tint */
      .wrt-bi[aria-pressed="true"] {
        color: var(--reader-link);
        background: color-mix(in srgb, var(--accent-soft) 70%, var(--reader-bg));
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, var(--reader-border));
      }
      .wrt-fused.is-active .wrt-bi[aria-pressed="true"] {
        border-left-color: color-mix(in srgb, var(--accent) 32%, var(--reader-border));
      }
      .wrt-read:focus-visible,
      .wrt-bi:focus-visible,
      .wrt-tab:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
        outline-offset: -2px;
        border-radius: 6px;
      }

      /* ===== Markdown body — copied from .markdown-view / .markdown-body ===== */
      .markdown-view {
        max-width: 760px;
        margin: 0 auto;
        color: var(--reader-text);
        line-height: 1.76;
      }
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3 {
        margin: 1.25em 0 0.45em;
        color: var(--reader-heading);
        line-height: 1.25;
      }
      .markdown-body h1 {
        font-size: 31px;
      }
      .markdown-body h1:first-child,
      .markdown-body h2:first-child {
        margin-top: 0;
      }
      .markdown-body h2 {
        padding-bottom: 6px;
        border-bottom: 1px solid var(--reader-border);
        font-size: 22px;
      }
      .markdown-body h3 {
        font-size: 18px;
      }
      .markdown-body p {
        margin: 0.7em 0;
      }
      .markdown-body a,
      .inline-wikilink {
        color: var(--reader-link);
        font-weight: 700;
        text-decoration: none;
      }
      .inline-wikilink {
        display: inline;
        padding: 0 1px;
        border: 0;
        border-bottom: 1px solid color-mix(in srgb, var(--reader-link) 55%, transparent);
        background: transparent;
        font: inherit;
        font-weight: 700;
        line-height: inherit;
        cursor: pointer;
      }
      .inline-wikilink:hover,
      .inline-wikilink.is-twin {
        color: var(--accent-strong);
        border-bottom-color: var(--accent-strong);
      }
      .inline-wikilink.is-twin {
        background: var(--accent-soft);
        border-radius: 3px;
      }
      .markdown-body code {
        padding: 2px 5px;
        border-radius: 5px;
        background: var(--reader-table-bg);
        color: var(--reader-text);
        font-family: var(--font-mono);
        font-size: 0.92em;
      }
      .markdown-body blockquote {
        margin: 1em 0;
        padding: 8px 12px;
        border-left: 3px solid var(--accent);
        background: var(--reader-quote-bg);
        color: var(--reader-text);
      }
      .markdown-body ul,
      .markdown-body ol {
        margin: 0.7em 0;
        padding-left: 1.35em;
      }
      .markdown-body li + li {
        margin-top: 0.24em;
      }
      .code-block {
        margin: 14px 0;
        overflow: hidden;
        border: 1px solid var(--reader-border);
        border-radius: var(--radius);
        background: var(--reader-code-bg);
      }
      .code-label {
        padding: 6px 10px;
        border-bottom: 1px solid var(--reader-border);
        color: #a8c9c2;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        font-family: var(--font-mono);
      }
      .code-block pre {
        margin: 0;
        overflow: auto;
        padding: 12px;
        color: #eef8f5;
        font-family: var(--font-mono);
        font-size: 13px;
        line-height: 1.6;
      }

      /* ===== bilingual parallel view ===== */
      .bi-statusbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
        padding: 8px 12px;
        border: 1px solid var(--reader-border);
        border-radius: var(--radius);
        background: color-mix(in srgb, var(--accent-soft) 60%, var(--reader-bg));
        font-size: 12.5px;
        color: var(--reader-text);
      }
      .bi-statusbar__left {
        display: inline-flex;
        align-items: center;
        gap: 9px;
      }
      .bi-chip {
        padding: 2px 8px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--green) 18%, transparent);
        color: var(--green);
        font-size: 11px;
        font-weight: 600;
      }
      .bi-statusbar__action {
        border: 0;
        background: transparent;
        color: var(--reader-link);
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
      }
      .bi-statusbar__action:hover {
        color: var(--accent-strong);
        text-decoration: underline;
      }
      .bi-spinner {
        width: 13px;
        height: 13px;
        border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: bi-spin 0.7s linear infinite;
      }
      @keyframes bi-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .bilingual-cols {
        position: relative;
      }
      .bilingual-cols::before {
        content: "";
        position: absolute;
        top: 30px;
        bottom: 0;
        left: 50%;
        width: 1px;
        transform: translateX(-0.5px);
        background: var(--reader-border);
      }
      .bi-colhead {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        column-gap: 40px;
        margin-bottom: 8px;
      }
      .bi-colhead span {
        padding: 0 4px 6px;
        color: var(--reader-muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-family: var(--font-mono);
      }
      .bilingual-stack {
        display: grid;
        row-gap: 6px;
        line-height: 1.76;
        color: var(--reader-text);
      }
      .bi-pair {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        column-gap: 40px;
        align-items: start;
        padding: 6px 4px 6px 12px;
        border-radius: 6px;
        transition: background 0.12s ease;
      }
      .bi-pair::before {
        content: "";
        position: absolute;
        left: 0;
        top: 6px;
        bottom: 6px;
        width: 2px;
        border-radius: 2px;
        background: transparent;
        transition: background 0.12s ease;
      }
      .bi-pair:hover {
        background: var(--accent-soft);
      }
      .bi-pair:hover::before {
        background: var(--accent);
      }
      .bi-block {
        min-width: 0;
      }
      .bi-block > :first-child {
        margin-top: 0;
      }
      .bi-block > :last-child {
        margin-bottom: 0;
      }
      .bi-skeleton {
        display: none;
      }
      .bi-pair.is-loading .bi-skeleton {
        display: block;
        padding-top: 2px;
      }
      .bi-pair.is-loading .bi-tr-text {
        display: none;
      }
      .bi-skeleton span {
        display: block;
        height: 0.78em;
        margin: 0.55em 0;
        border-radius: 5px;
        background: linear-gradient(
          90deg,
          var(--reader-table-bg) 0%,
          color-mix(in srgb, var(--reader-table-bg) 55%, var(--reader-bg)) 50%,
          var(--reader-table-bg) 100%
        );
        background-size: 200% 100%;
        animation: bi-shimmer 1.25s ease-in-out infinite;
      }
      .bi-skeleton span:nth-child(2) {
        width: 92%;
      }
      .bi-skeleton span:nth-child(3) {
        width: 64%;
      }
      .bi-tr-text {
        animation: bi-fade 0.45s ease;
      }
      @keyframes bi-shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
      @keyframes bi-fade {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* special blocks (code/chart/table): a single CENTERED shared instance —
         not spanning both columns, not duplicated. Masks the center hairline behind it. */
      .bi-pair--special {
        position: relative;
        z-index: 1;
        margin: 2px 0;
        padding: 4px 0;
        background: var(--reader-bg);
      }
      .bi-special {
        max-width: 600px;
        margin: 0 auto;
      }
      .bi-special .code-block {
        margin: 0;
      }

      /* ===== wikilink info card (click in bilingual mode → target's Chinese translation) ===== */
      .wiki-linkcard {
        position: fixed;
        z-index: 50;
        width: 312px;
        max-width: calc(100vw - 24px);
        padding: 13px 15px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow:
          0 10px 30px rgba(20, 29, 28, 0.18),
          var(--shadow);
        color: var(--text);
        font-size: 13px;
      }
      .wiki-linkcard__top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .wiki-linkcard__tags {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .wiki-linkcard__layer {
        padding: 2px 7px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 10px;
        font-family: var(--font-mono);
        text-transform: uppercase;
      }
      .wiki-linkcard__ai {
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-strong);
        font-size: 10px;
        font-weight: 700;
      }
      .wiki-linkcard__close {
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
      }
      .wiki-linkcard__title {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
      }
      .wiki-linkcard__summary {
        margin: 0 0 11px;
        color: var(--muted);
        line-height: 1.62;
      }
      .wiki-linkcard__foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .wiki-linkcard__path {
        color: var(--subtle);
        font-size: 11px;
        font-family: var(--font-mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .wiki-linkcard__open {
        flex: none;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface-2);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .wiki-linkcard__open:hover {
        border-color: var(--line-strong);
      }

      /* ===== Responsive fallback: narrow → stacked single column ===== */
      @media (max-width: 1100px) {
        .wiki-layout {
          grid-template-columns: minmax(0, 1fr);
        }
        .wiki-sidebar {
          position: static;
        }
        .bilingual-cols::before {
          display: none;
        }
        .bi-colhead {
          display: none;
        }
        .bi-pair {
          grid-template-columns: minmax(0, 1fr);
          row-gap: 2px;
        }
        .bi-block.bi-block--tr {
          margin-top: 4px;
          padding: 4px 10px;
          border-left: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
          background: color-mix(in srgb, var(--accent-soft) 55%, var(--reader-bg));
          border-radius: 0 6px 6px 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bi-skeleton span,
        .bi-tr-text,
        .bi-spinner {
          animation: none;
        }
        .bi-pair,
        .bi-pair::before {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="mock-topbar">
      <div class="mock-brand">
        <span class="dot"></span> OpenDIKW
        <small>· Mockup · #base 并行中文翻译</small>
      </div>
      <div class="mock-controls">
        <span class="mock-tag">仅对齐用 · 非真实代码</span>
        <label><input type="checkbox" id="cacheToggle" /> 模拟已缓存</label>
        <button class="mock-btn" id="themeToggle">🌙 深色</button>
      </div>
    </div>

    <div class="mock-page">
      <div class="wiki-layout">
        <aside class="wiki-sidebar">
          <div class="wiki-explorer__header">
            <h2>知识库</h2>
            <span>3 pages</span>
          </div>
          <ul class="wiki-list" id="fileList"></ul>
        </aside>

        <main class="wiki-reader panel" aria-label="Wiki reader">
          <div class="reader-header reader-header--stacked">
            <div class="reader-header__path" id="rdPath"></div>
            <div class="reader-header__meta--inline">
              <span class="soft-label" id="rdTime"></span>
              <span class="soft-label" id="rdLayer"></span>
              <span class="soft-label lang-badge" id="rdLang"></span>
            </div>
          </div>

          <div id="tabBar"></div>
          <section class="wiki-reader-tab-panel" id="readPanel"></section>
        </main>
      </div>
    </div>

    <script>
      // ----- Sample content (block-paired). src = source text, tr = Chinese translation. -----
      const PAGES = {
        dikw: {
          path: "knowledge/dikw-pyramid.md",
          time: "2026-05-30 14:20",
          layer: "knowledge · 12 anchors",
          blocks: [
            { type: "h1", src: "The DIKW Pyramid", tr: "DIKW 金字塔" },
            {
              type: "p",
              src: "The DIKW pyramid is a model for the relationships between <em>data</em>, <em>information</em>, <em>knowledge</em>, and <em>wisdom</em>. Each layer adds context and meaning to the one below it.",
              tr: "DIKW 金字塔是一个用于描述<em>数据</em>、<em>信息</em>、<em>知识</em>与<em>智慧</em>四者关系的模型。每一层都在其下一层的基础上增添语境与意义。",
            },
            { type: "h2", src: "From Data to Wisdom", tr: "从数据到智慧" },
            {
              type: "p",
              src: "Moving up the pyramid, raw observations are progressively refined. The transition is not automatic — it requires interpretation, synthesis, and judgment.",
              tr: "沿金字塔向上,原始观测被逐级提炼。这种跃迁并非自动发生——它需要解读、综合与判断。",
            },
            {
              type: "ul",
              srcItems: [
                "<strong>Data</strong> — raw, context-free signals (e.g. <code>37.0</code>).",
                "<strong>Information</strong> — data placed in context (&ldquo;a body temperature of 37.0&deg;C&rdquo;).",
                "<strong>Knowledge</strong> — patterns recognised across information (&ldquo;37.0&deg;C is a normal reading&rdquo;).",
                "<strong>Wisdom</strong> — knowing how and when to act on that knowledge.",
              ],
              trItems: [
                "<strong>数据</strong> — 原始的、无语境的信号(例如 <code>37.0</code>)。",
                "<strong>信息</strong> — 被置入语境的数据(&ldquo;体温为 37.0&deg;C&rdquo;)。",
                "<strong>知识</strong> — 在信息之间识别出的规律(&ldquo;37.0&deg;C 属于正常读数&rdquo;)。",
                "<strong>智慧</strong> — 懂得如何以及何时依据这些知识去行动。",
              ],
            },
            {
              type: "quote",
              src: "Information is data endowed with relevance and purpose. — Peter Drucker",
              tr: "信息是被赋予了相关性与目的的数据。——彼得·德鲁克",
            },
            { type: "h2", src: "A Worked Example", tr: "一个实例" },
            {
              type: "p",
              src: "Consider a small pipeline that ingests raw field notes and synthesises them into a curated knowledge layer:",
              tr: "设想一条简单的流水线,它摄入原始的现场笔记,并将它们综合进一个经过整理的知识层:",
            },
            {
              type: "code",
              codeLang: "bash",
              code: "dikw ingest ./notes --layer source\ndikw synth --from source --to knowledge",
            },
            {
              type: "p",
              src: 'Once synthesised, every claim links back to its <button class="inline-wikilink" type="button" data-wikilink="knowledge/source-notes.md" title="→ knowledge/source-notes.md">source notes</button>, so provenance is preserved all the way up the climb.',
              tr: '综合完成后,每一条论断都会链接回它的<button class="inline-wikilink" type="button" data-wikilink="knowledge/source-notes.md" title="→ knowledge/source-notes.md">来源笔记</button>,因此出处在整个攀升过程中都得以保留。',
            },
          ],
        },
        kg: {
          path: "knowledge/knowledge-graphs-101.md",
          time: "2026-05-22 09:05",
          layer: "knowledge · 7 anchors",
          blocks: [
            { type: "h1", src: "Knowledge Graphs 101", tr: "知识图谱入门" },
            {
              type: "p",
              src: "A knowledge graph stores facts as a network of entities and the relationships between them, rather than as rows in a table.",
              tr: "知识图谱以实体网络及其之间的关系来存储事实,而不是以表格中的行来存储。",
            },
            { type: "h2", src: "Nodes and Edges", tr: "节点与边" },
            {
              type: "p",
              src: "Each <strong>node</strong> is an entity; each <strong>edge</strong> is a typed, directed relationship. Meaning emerges from how nodes connect.",
              tr: "每个<strong>节点</strong>是一个实体;每条<strong>边</strong>是一种带类型、有方向的关系。意义正是从节点的连接方式中浮现的。",
            },
            {
              type: "ul",
              srcItems: [
                "Entities become nodes.",
                "Relationships become labelled edges.",
                "Queries traverse the graph instead of joining tables.",
              ],
              trItems: ["实体成为节点。", "关系成为带标签的边。", "查询通过遍历图来完成,而非连接表。"],
            },
          ],
        },
        zh: {
          path: "knowledge/zhishi-guanli-cengci.md",
          time: "2026-06-01 16:40",
          layer: "knowledge · 5 anchors",
          blocks: [
            { type: "h1", src: "知识管理的三个层次" },
            {
              type: "p",
              src: "知识管理可以粗略分为三个层次:采集、组织与运用。每一层都为上一层提供原料。",
            },
            { type: "h2", src: "为什么要分层" },
            {
              type: "p",
              src: "分层让我们能够分别优化「把信息收进来」与「把知识用出去」这两件性质不同的事。",
            },
            {
              type: "ul",
              srcItems: ["采集 — 把零散信息纳入系统。", "组织 — 建立结构与关联。", "运用 — 在需要时检索并行动。"],
            },
          ],
        },
      };

      // wikilink target stub — the info card shows the Chinese translation in bilingual mode.
      const LINK_TARGETS = {
        "knowledge/source-notes.md": {
          path: "knowledge/source-notes.md",
          layer: "source",
          titleEn: "Field Note — Sensor Readings",
          titleZh: "现场笔记 — 传感器读数",
          summaryEn:
            "Raw observations captured on site before any synthesis: timestamps, instrument IDs, and unprocessed values awaiting interpretation.",
          summaryZh: "综合之前在现场采集的原始观测:时间戳、仪器编号,以及尚待解读的未处理数值。",
        },
      };

      const SPECIAL = new Set(["code", "table", "chart"]);

      // ----- language detection AFTER render (we can't know the language before fetch) -----
      function pageIsEnglish(page) {
        const text = page.blocks
          .map((b) => (b.srcItems ? b.srcItems.join(" ") : b.src || b.code || ""))
          .join(" ");
        const cjk = (text.match(/[一-鿿]/g) || []).length;
        const letters = (text.match(/[A-Za-z一-鿿]/g) || []).length || 1;
        return cjk / letters < 0.15;
      }

      // ----- block → HTML for one side -----
      function blockHtml(b, side) {
        const text = side === "tr" ? b.tr : b.src;
        const items = side === "tr" ? b.trItems : b.srcItems;
        switch (b.type) {
          case "h1":
            return "<h1>" + text + "</h1>";
          case "h2":
            return "<h2>" + text + "</h2>";
          case "h3":
            return "<h3>" + text + "</h3>";
          case "p":
            return "<p>" + text + "</p>";
          case "quote":
            return "<blockquote><p>" + text + "</p></blockquote>";
          case "ul":
            return "<ul>" + items.map((i) => "<li>" + i + "</li>").join("") + "</ul>";
          case "code":
            return (
              '<div class="code-block"><div class="code-label">' +
              (b.codeLang || "text") +
              "</div><pre><code>" +
              b.code.replace(/&/g, "&amp;").replace(/</g, "&lt;") +
              "</code></pre></div>"
            );
          default:
            return "";
        }
      }

      // ----- renderers -----
      function renderMono(page) {
        const html = page.blocks.map((b) => blockHtml(b, "src")).join("");
        return '<article class="markdown-view"><div class="markdown-body">' + html + "</div></article>";
      }

      function statusbarHtml() {
        if (state.translating) {
          return (
            '<div class="bi-statusbar" role="status" aria-live="polite">' +
            '<span class="bi-statusbar__left"><span class="bi-spinner" aria-hidden="true"></span>正在翻译为中文…</span>' +
            '<button type="button" class="bi-statusbar__action" data-act="cancel">取消</button></div>'
          );
        }
        const chip = state.cached ? '<span class="bi-chip">已缓存</span>' : "";
        return (
          '<div class="bi-statusbar" role="status" aria-live="polite">' +
          '<span class="bi-statusbar__left">AI 翻译 · 中文' +
          chip +
          '</span><button type="button" class="bi-statusbar__action" data-act="retranslate">重新翻译</button></div>'
        );
      }

      function renderBilingual(page) {
        const loading = state.translating;
        let rows = "";
        page.blocks.forEach((b) => {
          if (SPECIAL.has(b.type)) {
            // single CENTERED shared instance — not spanning both columns, not duplicated
            rows += '<div class="bi-pair--special"><div class="bi-special">' + blockHtml(b, "src") + "</div></div>";
            return;
          }
          rows +=
            '<div class="bi-pair' +
            (loading ? " is-loading" : "") +
            '"><div class="bi-block bi-block--src">' +
            blockHtml(b, "src") +
            '</div><div class="bi-block bi-block--tr">' +
            '<div class="bi-skeleton" aria-hidden="true"><span></span><span></span><span></span></div>' +
            '<div class="bi-tr-text">' +
            blockHtml(b, "tr") +
            "</div></div></div>";
        });
        return (
          statusbarHtml() +
          '<div class="markdown-body bilingual-cols">' +
          '<div class="bi-colhead" aria-hidden="true"><span>原文 · EN</span><span>中文 · AI 翻译</span></div>' +
          '<div class="bilingual-stack">' +
          rows +
          "</div></div>"
        );
      }

      function renderTabs(isEn) {
        // Variant C: "Read" stays + a bonded 双语 mode-toggle (aria-pressed), shown ONLY for English pages.
        const biHalf = isEn
          ? '<button type="button" class="wrt-bi" aria-pressed="' +
            (state.bilingual ? "true" : "false") +
            '" aria-label="AI 翻译对照阅读" title="AI 翻译 · 中英对照阅读" data-act="toggle-bi">' +
            '<span class="wrt-bi__label">AI 翻译</span></button>'
          : "";
        return (
          '<div class="wiki-reader-tabs" role="tablist" aria-label="阅读视图">' +
          '<span class="wrt-fused is-active">' +
          '<button type="button" class="wrt-read" role="tab" aria-selected="true" data-act="read">Read</button>' +
          biHalf +
          "</span>" +
          '<button type="button" class="wrt-tab" role="tab" aria-selected="false" tabindex="-1">Info</button>' +
          '<button type="button" class="wrt-tab" role="tab" aria-selected="false" tabindex="-1">Outline</button>' +
          '<button type="button" class="wrt-tab" role="tab" aria-selected="false" tabindex="-1">Source</button>' +
          "</div>"
        );
      }

      // ----- state machine -----
      const state = { pageId: "dikw", bilingual: false, translating: false, cached: false };
      const $ = (id) => document.getElementById(id);

      function render() {
        const page = PAGES[state.pageId];
        const isEn = pageIsEnglish(page);
        if (!isEn) state.bilingual = false; // no toggle on non-English pages
        $("rdPath").textContent = page.path;
        $("rdTime").textContent = page.time;
        $("rdLayer").textContent = page.layer;
        $("rdLang").textContent = isEn ? "EN" : "中文";
        $("tabBar").innerHTML = renderTabs(isEn);

        const showBi = isEn && state.bilingual;
        $("readPanel").innerHTML = showBi ? renderBilingual(page) : renderMono(page);
        if (showBi && state.translating) runTranslation();
      }

      function runTranslation() {
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const pairs = Array.from($("readPanel").querySelectorAll(".bi-pair.is-loading"));
        if (reduce) {
          pairs.forEach((p) => p.classList.remove("is-loading"));
          state.translating = false;
          refreshStatusbar();
          return;
        }
        let i = 0;
        const step = () => {
          if (!state.translating || !state.bilingual) return; // cancelled / page changed
          if (i >= pairs.length) {
            state.translating = false;
            refreshStatusbar();
            return;
          }
          pairs[i].classList.remove("is-loading");
          i += 1;
          setTimeout(step, 280);
        };
        setTimeout(step, 420);
      }

      function refreshStatusbar() {
        const old = $("readPanel").querySelector(".bi-statusbar");
        if (!old) return;
        const tmp = document.createElement("div");
        tmp.innerHTML = statusbarHtml();
        old.replaceWith(tmp.firstElementChild);
      }

      // ----- wikilink info card -----
      function closeLinkCard() {
        const card = document.getElementById("linkCard");
        if (card) card.remove();
      }

      // `zh` = whether the CLICKED link was on the translated (Chinese) side. Clicking the
      // English-side link shows the original info; clicking the 中文 link shows the translation.
      function openLinkCard(target, rect, zh) {
        closeLinkCard();
        const t = LINK_TARGETS[target] || {
          path: target,
          layer: "—",
          titleEn: target,
          titleZh: target,
          summaryEn: "(no preview)",
          summaryZh: "(暂无预览)",
        };
        const title = zh ? t.titleZh : t.titleEn;
        const summary = zh ? t.summaryZh : t.summaryEn;
        const aiTag = zh ? '<span class="wiki-linkcard__ai">AI 翻译</span>' : "";
        const card = document.createElement("div");
        card.id = "linkCard";
        card.className = "wiki-linkcard";
        card.innerHTML =
          '<div class="wiki-linkcard__top"><span class="wiki-linkcard__tags">' +
          '<span class="wiki-linkcard__layer">' +
          t.layer +
          "</span>" +
          aiTag +
          '</span><button type="button" class="wiki-linkcard__close" data-act="card-close" aria-label="关闭">×</button></div>' +
          '<h3 class="wiki-linkcard__title">' +
          title +
          "</h3>" +
          '<p class="wiki-linkcard__summary">' +
          summary +
          "</p>" +
          '<div class="wiki-linkcard__foot"><span class="wiki-linkcard__path">' +
          t.path +
          '</span><button type="button" class="wiki-linkcard__open">设为主文档</button></div>';
        document.body.appendChild(card);
        // position under the clicked link, clamped to viewport
        const cw = card.offsetWidth;
        const ch = card.offsetHeight;
        let left = Math.min(rect.left, window.innerWidth - cw - 12);
        left = Math.max(12, left);
        let top = rect.bottom + 8;
        if (top + ch > window.innerHeight - 12) top = Math.max(12, rect.top - ch - 8);
        card.style.left = left + "px";
        card.style.top = top + "px";
      }

      // ----- events -----
      function buildFileList() {
        const order = ["dikw", "kg", "zh"];
        $("fileList").innerHTML = order
          .map((id) => {
            const p = PAGES[id];
            const title = (p.blocks[0] && (p.blocks[0].src || p.blocks[0].tr)) || p.path;
            return (
              '<li><button class="wiki-list__item' +
              (id === state.pageId ? " is-active" : "") +
              '" data-page="' +
              id +
              '"><span class="wl-body"><strong>' +
              title +
              "</strong><small>" +
              p.path +
              "</small></span></button></li>"
            );
          })
          .join("");
      }

      document.addEventListener("click", (e) => {
        const wl = e.target.closest(".inline-wikilink");
        if (wl) {
          const isTr = !!wl.closest(".bi-block--tr"); // clicked on the translation side?
          openLinkCard(wl.dataset.wikilink, wl.getBoundingClientRect(), isTr);
          return;
        }
        const cardEl = e.target.closest(".wiki-linkcard");
        if (e.target.closest('[data-act="card-close"]')) {
          closeLinkCard();
          return;
        }
        if (!cardEl) closeLinkCard(); // click outside the card dismisses it

        const fileBtn = e.target.closest("[data-page]");
        if (fileBtn) {
          state.pageId = fileBtn.dataset.page;
          state.bilingual = false;
          state.translating = false;
          buildFileList();
          render();
          return;
        }
        const act = e.target.closest("[data-act]");
        if (!act) return;
        switch (act.dataset.act) {
          case "read":
            state.bilingual = false;
            state.translating = false;
            render();
            break;
          case "toggle-bi":
            state.bilingual = !state.bilingual;
            state.translating = state.bilingual && !state.cached; // cache hit → skip loading
            render();
            break;
          case "cancel":
            state.bilingual = false;
            state.translating = false;
            render();
            break;
          case "retranslate":
            state.translating = true;
            render();
            break;
        }
      });

      // hover a wikilink → highlight its twin in the other column (same target)
      document.addEventListener("mouseover", (e) => {
        const wl = e.target.closest(".inline-wikilink");
        if (!wl || !wl.dataset.wikilink) return;
        document
          .querySelectorAll('.inline-wikilink[data-wikilink="' + CSS.escape(wl.dataset.wikilink) + '"]')
          .forEach((el) => el.classList.add("is-twin"));
      });
      document.addEventListener("mouseout", (e) => {
        if (!e.target.closest(".inline-wikilink")) return;
        document.querySelectorAll(".inline-wikilink.is-twin").forEach((el) => el.classList.remove("is-twin"));
      });

      $("cacheToggle").addEventListener("change", (e) => {
        state.cached = e.target.checked;
        if (state.bilingual && !state.translating) refreshStatusbar();
      });

      $("themeToggle").addEventListener("click", () => {
        const dark = document.documentElement.getAttribute("data-theme") === "dark";
        document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
        $("themeToggle").textContent = dark ? "🌙 深色" : "☀️ 浅色";
      });

      window.addEventListener("resize", closeLinkCard);

      buildFileList();
      render();
    </script>
  </body>
</html>
