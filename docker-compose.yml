# docker-compose example for dikw-web (production OIDC BFF mode).
# dikw-core and the OIDC IdP are provided externally (host, sibling container, or remote).
# Bind port 4321 to host loopback by default (put a TLS reverse proxy in front).

services:
  dikw-web:
    build: .
    image: dikw-web:local
    container_name: dikw-web
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      # Container listens on 0.0.0.0 so host port-forwarding can reach it;
      # non-loopback bind and NODE_ENV=production both require OIDC below.
      DIKW_WEB_HOST: "${DIKW_WEB_HOST:-0.0.0.0}"
      # Required: OIDC BFF authentication
      DIKW_WEB_AUTH_MODE: "oidc"
      DIKW_WEB_PUBLIC_URL: "${DIKW_WEB_PUBLIC_URL:?set DIKW_WEB_PUBLIC_URL in .env or shell}"
      DIKW_WEB_OIDC_ISSUER: "${DIKW_WEB_OIDC_ISSUER:?set DIKW_WEB_OIDC_ISSUER in .env or shell}"
      DIKW_WEB_OIDC_INTERNAL_URL: "${DIKW_WEB_OIDC_INTERNAL_URL:-}"
      DIKW_WEB_OIDC_CLIENT_ID: "${DIKW_WEB_OIDC_CLIENT_ID:?set DIKW_WEB_OIDC_CLIENT_ID in .env or shell}"
      DIKW_WEB_OIDC_CLIENT_SECRET: "${DIKW_WEB_OIDC_CLIENT_SECRET:?set DIKW_WEB_OIDC_CLIENT_SECRET in .env or shell}"
      DIKW_WEB_OIDC_ROLES_CLAIM: "${DIKW_WEB_OIDC_ROLES_CLAIM:-roles}"
      DIKW_WEB_OIDC_ROLES_OWNER: "${DIKW_WEB_OIDC_ROLES_OWNER:-}"
      DIKW_WEB_ROLE_VIEWER: "${DIKW_WEB_ROLE_VIEWER:-}"
      DIKW_WEB_ROLE_EDITOR: "${DIKW_WEB_ROLE_EDITOR:-}"
      DIKW_WEB_SESSION_SECRET: "${DIKW_WEB_SESSION_SECRET:?set DIKW_WEB_SESSION_SECRET in .env or shell}"
      DIKW_CORE_URL: "${DIKW_CORE_URL:?set DIKW_CORE_URL in .env or shell}"
      DIKW_SERVER_TOKEN: "${DIKW_SERVER_TOKEN:?set DIKW_SERVER_TOKEN in .env or shell}"
      # Required: LLM credentials
      DIKW_AGENT_PROVIDER: "${DIKW_AGENT_PROVIDER:-minimax}"
      DIKW_AGENT_API: "${DIKW_AGENT_API:-anthropic-messages}"
      DIKW_AGENT_API_KEY: "${DIKW_AGENT_API_KEY:?set DIKW_AGENT_API_KEY in .env or shell}"
      DIKW_AGENT_BASE_URL: "${DIKW_AGENT_BASE_URL:?set DIKW_AGENT_BASE_URL in .env or shell}"
      DIKW_AGENT_MODEL: "${DIKW_AGENT_MODEL:?set DIKW_AGENT_MODEL in .env or shell}"
      # Optional: web search / fetch tools
      DIKW_AGENT_TAVILY_API_KEY: "${DIKW_AGENT_TAVILY_API_KEY:-}"
      DIKW_AGENT_JINA_API_KEY: "${DIKW_AGENT_JINA_API_KEY:-}"
      # Optional: Import page PDF / Office conversion (/web/mineru/*)
      DIKW_WEB_MINERU_API_KEY: "${DIKW_WEB_MINERU_API_KEY:-}"
    volumes:
      - dikw-agent-sessions:/data/agent-sessions
    restart: unless-stopped
    # Allow container to reach host services on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  dikw-agent-sessions:
    name: dikw-agent-sessions
